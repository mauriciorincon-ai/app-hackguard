# Capturas de HackGuard para su ficha en CV Viva (pedido 026, 2026-10-27). Build de producción de b5acd4b en una copia
# aislada, con la fecha de consulta del commit (2026-10-14), tema claro, interfaz en español; tomas con propósito (2026-10-31): cada pieza completa, centrada sobre el fondo de la app, con margen, y ampliada hasta llenar el lienzo de 1536×960 (a DPR 3, en el ancho de ventana que más llena); la barra de navegación no entra en ninguna.
# Datos: solo los activos, lotes, hallazgos y propuestas demo sintéticos del repo. Ninguna muestra una carga ni un ataque.
# S13 (2026-11-11): F19–F32 se tomaron del build del sprint 13, con la fecha de consulta 2026-10-05, mismo lienzo y mismo tema; F29 sale de la pantalla de la ficha con la ficha demo sintética, F31 de la exportación pública y F32 del paquete. F01–F18 conservan su toma original.
