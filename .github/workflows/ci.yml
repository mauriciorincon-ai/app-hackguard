# CI del kit-app — corre en cada PR y en push a main.
# Gates: typecheck, lint, tests+cobertura, build, audit de deps, e2e,
#        Lighthouse vs perf-budget.json Y vs lighthouse-categorias.json (>=90 en las 4).
# Regla del metodo (v1.12.0): TODO gate nuevo de este archivo nace con su DEMO — un cambio
# deliberado que lo pone en ROJO, registrado en la bitacora del sprint. Gate sin demo = decorado.
# Regla del kit (v1.26.0): todo job que pueda ponerse ROJO sube su EVIDENCIA al fallar —
# un rojo de CI que no se reproduce en local es ciego sin sus trazas (hoja-de-vida post-S7:
# un fallo de hidratacion aparecio dos veces como flaky y solo se cazo cuando el job subio
# los test-results de Playwright).
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check     # unico gate que ve un peer insatisfecho (kit v1.24.0 — caso @supabase/ssr)
      - name: Regla 18 — ningun paquete por debajo de main (kit v1.32.0)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          node scripts/verificar-dependencias.mjs origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      # HackGuard S1 (AU-11): gitleaks en el runner, la misma versión que en local. Sin él, la prueba que bloquea la
      # carnada del hook se saltaba («skipped» no es verde); ahora, si falta, falla. La descarga se verifica contra el
      # checksums.txt del release.
      - name: gitleaks 8.30.1 (prueba del hook de secretos)
        run: |
          v=8.30.1
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_checksums.txt"
          grep " gitleaks_${v}_linux_x64.tar.gz$" "gitleaks_${v}_checksums.txt" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      - run: pnpm test            # vitest run --coverage (umbral 70% en vitest.config)
      # HackGuard S1 — el catálogo de datos/ es válido: sale 0 (ok) o 1 (con advertencias); 2 (inválido) o 3
      # (error de uso o de lectura) dejan la CI en rojo.
      - name: Catálogo válido (pnpm catalogo:validar sale 0 o 1)
        run: pnpm catalogo:validar || [ $? -eq 1 ]
      - run: pnpm build
      # kit v1.39.0 — lo que el proveedor publica no es lo que el build escribe (Big-D S2, S2-AUD-32): en el perfil
      # --estatico hace `vercel build` sin conexion con el adapter de Next y exige que cada pagina publicada sea
      # identica a la de out/. En el perfil web dice «n/a» y pasa.
      - name: Build como el proveedor y salida publicada = out/ (kit v1.39.0)
        run: node scripts/build-como-proveedor.mjs
      - run: pnpm audit --audit-level high
      # kit v2.0.0 (regla 17): la producción se muestra, jamás se entrega. Barre el árbol versionado y el campo
      # homepage del repo; los dominios viven en cero-enlaces.json. Nace verde (sweep limpio en el S2) y su rojo
      # lo demuestra tests/unit/cero-enlaces.test.ts.
      - name: Cero enlaces — árbol y homepage del repo (regla 17, kit v2.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HOMEPAGE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.homepage // ""')"
          node scripts/cero-enlaces.mjs --homepage "$HOMEPAGE"

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Firefox y WebKit solo corren tests/e2e/determinismo.spec.ts: la misma huella en los tres motores (RNF-01).
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright)
      # El primer reintento graba trace (playwright.config `trace: on-first-retry`) con
      # consola, errores y DOM — se sube SOLO cuando algo falla (kit v1.26.0).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI — budgets (perf-budget.json) + categorias >=90 (kit v1.12.0)
        # Cada sprint añade sus rutas nuevas a lighthouse-urls.json (default: ["/"]).
        # Nota Lantern: el LCP SIMULADO sobre localhost castiga SPAs sanas (nutri-kids S1:
        # 3.8s simulado vs 242ms observado) — budgets client-side necesitan margen documentado.
        # DOS asserts sobre UNA sola coleccion: LHCI declara `budgetsFile` mutuamente excluyente
        # con `assertions` — y la casilla ">=90 en las 4 categorias" del /deploy-check no la
        # medía nadie hasta v1.12.0 (el budget mide tiempos y pesos, que es otra cosa).
        # kit v2.0.0: UNA corrida por URL (regla del kit; antes eran tres con median-run);
        # lighthouse-margen avisa cuando un valor queda a menos del 10 % de su presupuesto.
        run: |
          npm i -g @lhci/cli
          URLS=$(node -e "console.log(require('./lighthouse-urls.json').map(u=>'--url=http://localhost:3000'+u).join(' '))")
          # Sprint 3: la PRIMERA medición tras arrancar el servidor sale lenta sea cual sea la página (con el orden de las URLs
          # invertido falló la que iba primero, TBT 400 a 533 ms, y pasó la otra). Se arranca el servidor aparte y se mide una
          # vez una página que NO se evalúa para calentarlo; después se borra esa medición y se mide de verdad. Los
          # presupuestos no cambian.
          pnpm start > servidor.log 2>&1 &
          # Con límite: si el servidor no arranca, el job falla enseñando su log en vez de colgarse hasta el tope de horas.
          timeout 90 bash -c 'until curl -sf http://localhost:3000/catalogo > /dev/null; do sleep 1; done' || { cat servidor.log; exit 1; }
          lhci collect --numberOfRuns=1 --url=http://localhost:3000/catalogo > /dev/null
          rm -rf .lighthouseci
          lhci collect --numberOfRuns=1 $URLS
          lhci assert --budgetsFile=./perf-budget.json
          lhci assert --config=./lighthouse-categorias.json
          # kit v1.37.0: margen (<10 % del presupuesto = aviso) + toda URL medida tiene presupuesto (rojo si no)
          node scripts/lighthouse-margen.mjs
