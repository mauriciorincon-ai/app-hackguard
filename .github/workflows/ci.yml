# CI del kit-app — corre en cada PR y en push a main.
# Gates: typecheck, lint, tests+cobertura, build, audit de deps, e2e,
#        Lighthouse vs perf-budget.json Y vs lighthouse-categorias.json (>=90 en las 4).
# Regla del metodo (v1.12.0): TODO gate nuevo de este archivo nace con su DEMO — un cambio
# deliberado que lo pone en ROJO, registrado en la bitacora del sprint. Gate sin demo = decorado.
# Regla del kit (v1.26.0): todo job que pueda ponerse ROJO sube su EVIDENCIA al fallar —
# un rojo de CI que no se reproduce en local es ciego sin sus trazas (hoja-de-vida post-S7:
# un fallo de hidratacion aparecio dos veces como flaky y solo se cazo cuando el job subio
# los test-results de Playwright).
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check     # unico gate que ve un peer insatisfecho (kit v1.24.0 — caso @supabase/ssr)
      - name: Regla 18 — ningun paquete por debajo de main (kit v1.32.0)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          node scripts/verificar-dependencias.mjs origin/main
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test            # vitest run --coverage (umbral 70% en vitest.config)
      - run: pnpm build
      - run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e        # incluye scans axe (@axe-core/playwright)
      # El primer reintento graba trace (playwright.config `trace: on-first-retry`) con
      # consola, errores y DOM — se sube SOLO cuando algo falla (kit v1.26.0).
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6   # SIN `version`: la lee de "packageManager" del package.json (fuente unica, kit v1.10.2)
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Lighthouse CI — budgets (perf-budget.json) + categorias >=90 (kit v1.12.0)
        # Cada sprint añade sus rutas nuevas a lighthouse-urls.json (default: ["/"]).
        # Nota Lantern: el LCP SIMULADO sobre localhost castiga SPAs sanas (nutri-kids S1:
        # 3.8s simulado vs 242ms observado) — budgets client-side necesitan margen documentado.
        # DOS asserts sobre UNA sola coleccion: LHCI declara `budgetsFile` mutuamente excluyente
        # con `assertions` — y la casilla ">=90 en las 4 categorias" del /deploy-check no la
        # medía nadie hasta v1.12.0 (el budget mide tiempos y pesos, que es otra cosa).
        # UNA corrida NO es una medicion (kit v1.26.0): el servidor recien levantado dio un
        # falso rojo reproducible en hoja-de-vida S7 y casi se paga con optimizacion a ciegas.
        # Tres corridas por URL y se asevera sobre la MEDIANA (median-run), nunca la optimista.
        run: |
          npm i -g @lhci/cli
          URLS=$(node -e "console.log(require('./lighthouse-urls.json').map(u=>'--url=http://localhost:3000'+u).join(' '))")
          lhci collect --startServerCommand="pnpm start" --numberOfRuns=3 $URLS
          lhci assert --budgetsFile=./perf-budget.json --aggregationMethod=median-run
          lhci assert --config=./lighthouse-categorias.json --aggregationMethod=median-run
